<!DOCTYPE html>

<html lang="pt-br">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GameTI Educando | Acesso</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: 'Outfit', sans-serif;
        background: #060912;
        color: white;
    }

    .background {
        min-height: 100vh;

        background:
            radial-gradient(
                circle at 20% 20%,
                rgba(139,92,246,.20),
                transparent 35%
            ),

            radial-gradient(
                circle at 80% 80%,
                rgba(236,72,153,.15),
                transparent 35%
            ),

            #060912;
    }

    .card {

        background: rgba(15,23,42,.90);

        backdrop-filter: blur(18px);

        border: 1px solid rgba(139,92,246,.25);

        box-shadow:
            0 25px 80px rgba(0,0,0,.55);

    }

    .input {

        width: 100%;

        background: rgba(2,6,23,.75);

        border: 1px solid rgba(148,163,184,.20);

        color: white;

        border-radius: 14px;

        padding: 14px 16px 14px 45px;

        outline: none;

        transition: .25s;

    }

    .input:focus {

        border-color: #8b5cf6;

        box-shadow:
            0 0 0 3px rgba(139,92,246,.12);

    }

    select.input {

        appearance: auto;

    }

    .button {

        background:
            linear-gradient(
                90deg,
                #7c3aed,
                #db2777
            );

        transition: .25s;

    }

    .button:hover {

        transform: translateY(-2px);

        box-shadow:
            0 12px 30px rgba(139,92,246,.30);

    }

    .secondary-button {

        background: rgba(139,92,246,.10);

        border: 1px solid rgba(139,92,246,.25);

        transition: .25s;

    }

    .secondary-button:hover {

        background: rgba(139,92,246,.20);

    }

    .error {

        display: none;

    }

    .success {

        display: none;

    }

</style>
```

</head>

<body>

<div class="background flex items-center justify-center p-6">

<!-- ================================================= -->
<!-- TELA DE LOGIN                                    -->
<!-- ================================================= -->

<div id="loginScreen"
     class="card w-full max-w-md rounded-[35px] p-8 md:p-10">


    <!-- LOGO -->

    <div class="text-center mb-8">

        <div
            class="w-20 h-20 mx-auto mb-5
                   bg-gradient-to-br
                   from-purple-600
                   to-pink-500
                   rounded-3xl
                   flex items-center
                   justify-center
                   shadow-2xl">

            <span class="text-4xl font-black italic">
                G
            </span>

        </div>


        <h1 class="text-3xl font-black">

            GAMETI
            <span class="text-purple-500">
                EDUCANDO
            </span>

        </h1>


        <p class="text-slate-400 text-sm mt-2">

            Entre para acessar sua jornada
            de aprendizagem

        </p>

    </div>


    <!-- FORM LOGIN -->

    <form onsubmit="realizarLogin(event)"
          class="space-y-5">


        <!-- APELIDO -->

        <div>

            <label
                class="block text-xs font-bold
                       uppercase text-slate-400 mb-2">

                Usuário

            </label>


            <div class="relative">

                <i
                    class="fas fa-user
                           absolute left-4 top-1/2
                           -translate-y-1/2
                           text-purple-400">
                </i>


                <input
                    id="loginApelido"
                    type="text"
                    class="input"
                    placeholder="Digite seu apelido"
                    required
                >

            </div>

        </div>


        <!-- SENHA -->

        <div>

            <label
                class="block text-xs font-bold
                       uppercase text-slate-400 mb-2">

                Senha

            </label>


            <div class="relative">

                <i
                    class="fas fa-lock
                           absolute left-4 top-1/2
                           -translate-y-1/2
                           text-purple-400">
                </i>


                <input
                    id="loginSenha"
                    type="password"
                    class="input"
                    placeholder="Digite sua senha"
                    required
                >


                <button
                    type="button"
                    onclick="mostrarSenha('loginSenha')"
                    class="absolute right-4
                           top-1/2
                           -translate-y-1/2
                           text-slate-400">

                    <i class="fas fa-eye"></i>

                </button>

            </div>

        </div>


        <!-- ERRO -->

        <div id="loginError"
             class="error
                    text-sm
                    text-red-400
                    bg-red-500/10
                    border border-red-500/20
                    rounded-xl p-3">

            <i class="fas fa-circle-exclamation mr-2"></i>

            Usuário ou senha incorretos.

        </div>


        <!-- ENTRAR -->

        <button
            type="submit"
            class="button
                   w-full
                   py-4
                   rounded-2xl
                   font-black
                   uppercase
                   tracking-wider">

            <i class="fas fa-right-to-bracket mr-2"></i>

            Entrar

        </button>


    </form>


    <!-- CADASTRO -->

    <div class="mt-8 pt-6
                border-t border-slate-700
                text-center">


        <p class="text-sm text-slate-400 mb-3">

            Ainda não possui cadastro?

        </p>


        <button
            onclick="abrirCadastro()"
            class="secondary-button
                   w-full
                   py-3
                   rounded-xl
                   font-bold
                   text-purple-300">

            <i class="fas fa-user-plus mr-2"></i>

            QUERO ME CADASTRAR

        </button>


    </div>


</div>



<!-- ================================================= -->
<!-- TELA DE CADASTRO                                  -->
<!-- ================================================= -->

<div id="cadastroScreen"
     class="card
            hidden
            w-full
            max-w-lg
            rounded-[35px]
            p-8 md:p-10">


    <!-- CABEÇALHO -->

    <div class="text-center mb-8">

        <div
            class="w-16 h-16 mx-auto mb-4
                   bg-gradient-to-br
                   from-purple-600
                   to-pink-500
                   rounded-2xl
                   flex items-center
                   justify-center">

            <i class="fas fa-user-plus text-2xl"></i>

        </div>


        <h1 class="text-3xl font-black">

            CRIAR
            <span class="text-purple-500">
                CADASTRO
            </span>

        </h1>


        <p class="text-slate-400 text-sm mt-2">

            Crie seu perfil no GameTI Educando

        </p>

    </div>


    <!-- FORMULÁRIO -->

    <form onsubmit="realizarCadastro(event)"
          class="space-y-4">


        <!-- NOME -->

        <div>

            <label
                class="block text-xs font-bold
                       uppercase text-slate-400 mb-2">

                Nome completo do aluno

            </label>


            <div class="relative">

                <i
                    class="fas fa-id-card
                           absolute left-4 top-1/2
                           -translate-y-1/2
                           text-purple-400">
                </i>


                <input
                    id="nomeCompleto"
                    type="text"
                    class="input"
                    placeholder="Digite seu nome completo"
                    required
                >

            </div>

        </div>


        <!-- SÉRIE -->

        <div>

            <label
                class="block text-xs font-bold
                       uppercase text-slate-400 mb-2">

                Série

            </label>


            <div class="relative">

                <i
                    class="fas fa-graduation-cap
                           absolute left-4 top-1/2
                           -translate-y-1/2
                           text-purple-400">
                </i>


                <select
                    id="serie"
                    class="input"
                    required>

                    <option value="">
                        Selecione sua série
                    </option>

                    <option value="1º Ano">
                        1º Ano
                    </option>

                    <option value="2º Ano">
                        2º Ano
                    </option>

                    <option value="3º Ano">
                        3º Ano
                    </option>

                </select>

            </div>

        </div>


        <!-- CURSO -->

        <div>

            <label
                class="block text-xs font-bold
                       uppercase text-slate-400 mb-2">

                Curso

            </label>


            <div class="relative">

                <i
                    class="fas fa-laptop-code
                           absolute left-4 top-1/2
                           -translate-y-1/2
                           text-purple-400">
                </i>


                <select
                    id="curso"
                    class="input"
                    required>

                    <option value="">
                        Selecione seu curso
                    </option>

                    <option value="Desenvolvimento de Sistemas">

                        Desenvolvimento de Sistemas

                    </option>

                    <option value="Redes de Computadores">

                        Redes de Computadores

                    </option>

                </select>

            </div>

        </div>


        <!-- APELIDO -->

        <div>

            <label
                class="block text-xs font-bold
                       uppercase text-slate-400 mb-2">

                Usuário

            </label>


            <div class="relative">

                <i
                    class="fas fa-gamepad
                           absolute left-4 top-1/2
                           -translate-y-1/2
                           text-purple-400">
                </i>


                <input
                    id="cadastroApelido"
                    type="text"
                    class="input"
                    placeholder="Escolha seu apelido"
                    required
                >

            </div>

        </div>


        <!-- SENHA -->

        <div>

            <label
                class="block text-xs font-bold
                       uppercase text-slate-400 mb-2">

                Senha

            </label>


            <div class="relative">

                <i
                    class="fas fa-lock
                           absolute left-4 top-1/2
                           -translate-y-1/2
                           text-purple-400">
                </i>


                <input
                    id="cadastroSenha"
                    type="password"
                    class="input"
                    placeholder="Crie uma senha"
                    required
                >

            </div>

        </div>


        <!-- CONFIRMAR SENHA -->

        <div>

            <label
                class="block text-xs font-bold
                       uppercase text-slate-400 mb-2">

                Confirmar senha

            </label>


            <div class="relative">

                <i
                    class="fas fa-lock
                           absolute left-4 top-1/2
                           -translate-y-1/2
                           text-purple-400">
                </i>


                <input
                    id="confirmarSenha"
                    type="password"
                    class="input"
                    placeholder="Digite a senha novamente"
                    required
                >

            </div>

        </div>


        <!-- ERRO CADASTRO -->

        <div id="cadastroError"
             class="error
                    text-sm
                    text-red-400
                    bg-red-500/10
                    border border-red-500/20
                    rounded-xl p-3">

        </div>


        <!-- SUCESSO -->

        <div id="cadastroSuccess"
             class="success
                    text-sm
                    text-green-400
                    bg-green-500/10
                    border border-green-500/20
                    rounded-xl p-3">

            <i class="fas fa-circle-check mr-2"></i>

            Cadastro realizado com sucesso!

        </div>


        <!-- BOTÃO CADASTRAR -->

        <button
            type="submit"
            class="button
                   w-full
                   py-4
                   rounded-2xl
                   font-black
                   uppercase
                   tracking-wider">

            <i class="fas fa-user-plus mr-2"></i>

            Criar cadastro

        </button>


    </form>


    <!-- VOLTAR -->

    <button
        onclick="voltarLogin()"
        class="w-full
               mt-4
               py-3
               rounded-xl
               text-slate-400
               hover:text-white
               transition">

        <i class="fas fa-arrow-left mr-2"></i>

        Já tenho cadastro

    </button>


</div>

</div>

<script>


/* =====================================================
   ABRIR CADASTRO
===================================================== */

function abrirCadastro() {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");


    document
        .getElementById("cadastroScreen")
        .classList.remove("hidden");

}



/* =====================================================
   VOLTAR PARA LOGIN
===================================================== */

function voltarLogin() {

    document
        .getElementById("cadastroScreen")
        .classList.add("hidden");


    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

}



/* =====================================================
   CADASTRO
===================================================== */

function realizarCadastro(event) {

    event.preventDefault();


    const nome =
        document.getElementById("nomeCompleto").value.trim();

    const serie =
        document.getElementById("serie").value;

    const curso =
        document.getElementById("curso").value;

    const usuario =
        document.getElementById("cadastroApelido").value.trim();

    const senha =
        document.getElementById("cadastroSenha").value;

    const confirmar =
        document.getElementById("confirmarSenha").value;


    const erro =
        document.getElementById("cadastroError");

    const sucesso =
        document.getElementById("cadastroSuccess");


    erro.style.display = "none";
    sucesso.style.display = "none";


    /* VERIFICA SENHAS */

    if (senha !== confirmar) {

        erro.innerHTML =
            '<i class="fas fa-circle-exclamation mr-2"></i>' +
            'As senhas não são iguais.';

        erro.style.display = "block";

        return;

    }


    /* VERIFICA TAMANHO DA SENHA */

    if (senha.length < 4) {

        erro.innerHTML =
            '<i class="fas fa-circle-exclamation mr-2"></i>' +
            'A senha deve possuir pelo menos 4 caracteres.';

        erro.style.display = "block";

        return;

    }


    /*
       SALVA O ALUNO NO NAVEGADOR

       IMPORTANTE:
       Isto é apenas uma demonstração.
    */

    const aluno = {

        nome: nome,

        serie: serie,

        curso: curso,

        usuario: usuario,

        senha: senha

    };


    localStorage.setItem(
        "alunoGameTI",
        JSON.stringify(aluno)
    );


    sucesso.style.display = "block";


    /*
       Após 1,5 segundos,
       volta para o login.
    */

    setTimeout(function() {

        voltarLogin();

        document
            .getElementById("loginApelido")
            .value = usuario;

    }, 1500);

}



/* =====================================================
   LOGIN
===================================================== */

function realizarLogin(event) {

    event.preventDefault();


    const usuario =
        document
            .getElementById("loginApelido")
            .value.trim();


    const senha =
        document
            .getElementById("loginSenha")
            .value;


    const erro =
        document
            .getElementById("loginError");


    /*
       PEGA O ALUNO CADASTRADO
    */

    const alunoSalvo =
        localStorage.getItem("alunoGameTI");


    /*
       SE NÃO EXISTIR CADASTRO
    */

    if (!alunoSalvo) {

        erro.innerHTML =
            '<i class="fas fa-circle-exclamation mr-2"></i>' +
            'Você ainda não possui cadastro.';

        erro.style.display = "block";

        return;

    }


    const aluno =
        JSON.parse(alunoSalvo);


    /*
       VERIFICA LOGIN
    */

    if (
        usuario === aluno.usuario &&
        senha === aluno.senha
    ) {

        erro.style.display = "none";


        /*
           SALVA O ALUNO LOGADO
           PARA A PÁGINA PRINCIPAL
        */

        localStorage.setItem(
            "alunoLogado",
            JSON.stringify(aluno)
        );


        /*
           ABRE O SISTEMA
        */

        window.location.href = "principal.html";


    } else {

        erro.innerHTML =
            '<i class="fas fa-circle-exclamation mr-2"></i>' +
            'Usuário ou senha incorretos.';

        erro.style.display = "block";

    }

}



/* =====================================================
   MOSTRAR / OCULTAR SENHA
===================================================== */

function mostrarSenha(id) {

    const campo =
        document.getElementById(id);


    if (campo.type === "password") {

        campo.type = "text";

    } else {

        campo.type = "password";

    }

}

</script>

</body>

</html>
